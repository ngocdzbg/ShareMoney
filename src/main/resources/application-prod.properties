# MySQL ===============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT =================================================================
jwt.secret=${JWT_SECRET}

# CORS ================================================================
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Redis ===============================================================
# Prefer Render REDIS_URL. Use redis:// or rediss:// depending on provider SSL.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Tạm không để Redis health check làm /actuator/health fail
management.health.redis.enabled=false

# Kafka ===============================================================
app.kafka.enabled=${KAFKA_ENABLED:false}

# Nếu chưa có Kafka cloud thì fallback localhost để tránh unresolved placeholder
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Quan trọng: không tự start Kafka listeners khi KAFKA_ENABLED=false
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:false}

# Production logging ==================================================
server.forward-headers-strategy=framework
logging.level.com.ngocnb.sharemoney=INFO
logging.level.org.springframework.cache=WARN
logging.level.org.springframework.data.redis=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.springframework.security=WARN
logging.pattern.level=%5p [requestId=%X{requestId:-}]
