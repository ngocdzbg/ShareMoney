# Application ==========================================================
spring.application.name=Share-Money
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server ===============================================================
server.port=${PORT:6969}

# JPA / Hibernate ======================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# Data Serialization ==================================================
spring.data.web.pageable.serialization-mode=via_dto

# JWT =================================================================
jwt.secret=${JWT_SECRET}

# Token expiration (milliseconds)
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# CORS ================================================================
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Swagger / OpenAPI ===================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator ============================================================
management.endpoints.web.exposure.include=health,metrics

# Logging =============================================================
logging.level.com.ngocnb.sharemoney=INFO
logging.level.org.springframework.security=INFO
logging.level.com.ngocnb.sharemoney.idempotency=INFO
logging.level.com.ngocnb.sharemoney.kafka=INFO
logging.pattern.level=%5p [requestId=%X{requestId:-}]

# HikariCP ============================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Tomcat Metrics ======================================================
server.tomcat.mbeanregistry.enabled=true

# Tomcat Thread Pool ==================================================
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# Redis Cache =========================================================
app.redis.enabled=${REDIS_ENABLED:false}
management.health.redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.database=0
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

spring.cache.type=${CACHE_TYPE:none}
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Kafka ===============================================================
app.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:false}
spring.kafka.admin.fail-fast=false
# Local default:
#   localhost:9092
#
# Render / Production:
#   Set KAFKA_BOOTSTRAP_SERVERS environment variable.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Producer ======================================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all

spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000

# Outbox waits for broker acknowledgement; failures remain PENDING for retry.
app.outbox.publish-timeout=15s

# Kafka Consumer ======================================================
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:share-money-group}
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.ngocnb.sharemoney.event,com.ngocnb.sharemoney.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.ngocnb.sharemoney.event.ExpenseEvent
