# Application ==========================================================
spring.application.name=Share-Money
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server ===============================================================
server.port=${PORT:6969}

# JPA / Hibernate ======================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# Data Serialization ==================================================
spring.data.web.pageable.serialization-mode=via_dto

# JWT =================================================================
# Non-secret expiration settings can be shared across profiles
jwt.expiration=86400000
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# CORS ================================================================
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Swagger / OpenAPI ===================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator ============================================================
management.endpoints.web.exposure.include=health,metrics

# Logging =============================================================
logging.level.com.ngocnb.sharemoney=INFO
logging.level.org.springframework.security=INFO
logging.level.com.ngocnb.sharemoney.idempotency=INFO
logging.level.com.ngocnb.sharemoney.kafka=INFO

# HikariCP ============================================================
# Keep conservative defaults because Render Free has very little RAM/CPU
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Tomcat Metrics ======================================================
server.tomcat.mbeanregistry.enabled=true

# Tomcat Thread Pool ==================================================
# Render Free is only 0.1 CPU / 512 MB RAM, so don't use 200 threads here
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# Redis Cache defaults ================================================
spring.data.redis.database=0
spring.data.redis.timeout=2s
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# Kafka Producer ======================================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000

# Kafka Consumer ======================================================
spring.kafka.consumer.group-id=share-money-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.ngocnb.sharemoney.event,com.ngocnb.sharemoney.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.ngocnb.sharemoney.event.ExpenseEvent